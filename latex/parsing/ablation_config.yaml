results_base_path: "llm_exp/results/llama-2-7b-chat-hf"
templates_path: "latex/templates"
output_dir: "latex/parsing/output/ablation_section"
section_title: "Ablations"

subsections:
  - config:
      name: "Renorm / CLIP comparisons"
      template_file: "subsection_renorm_clip.tex"
      skip: false
      artifacts:
        dogstocats:
          latex_type: "tab"
          caption: "Renorm/Clip Comparison - Dogs$\\to$Cats"
          renorm_clip_comparison_table:
            renorm_clip_experiment: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_renorm_clip"
            no_renorm_clip_experiment: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_clip_all_strengths"
            renorm_no_clip_experiment: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_renorm_no_clip"
            no_renorm_no_clip_experiment: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_no_clip_all_strengths"
            beta_value: 2.0
            enable_highlighting: true
            task_filter: "dogs_to_cats"
        horsestomotorcycles:
          latex_type: "tab"
          caption: "Renorm/Clip Comparison - Horses$\\to$Motorcycles"
          renorm_clip_comparison_table:
            renorm_clip_experiment: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_renorm_clip"
            no_renorm_clip_experiment: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_clip_all_strengths"
            renorm_no_clip_experiment: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_renorm_no_clip"
            no_renorm_no_clip_experiment: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_no_clip_all_strengths"
            beta_value: 2.0
            enable_highlighting: true
            task_filter: "horses_to_motorcycles"

  - config:
      name: "Raw results"
      template_file: "subsection_raw_results.tex" 
      skip: false
      artifacts:
        with_clipping_dogs_to_cats:
          latex_type: "tab"
          caption: "Comprehensive Results: midsteer\\_sa\\_fix\\_50k\\_last\\_no\\_renorm\\_clip\\_all\\_strengths - Dogs$\\to$Cats"
          single_experiment_result:
            experiment_path: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_clip_all_strengths"
            enable_highlighting: true
            task_filter: "dogs_to_cats"
        with_clipping_horses_to_motorcycles:
          latex_type: "tab"
          caption: "Comprehensive Results: midsteer\\_sa\\_fix\\_50k\\_last\\_no\\_renorm\\_clip\\_all\\_strengths - Horses$\\to$Motorcycles"
          single_experiment_result:
            experiment_path: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_clip_all_strengths"
            enable_highlighting: true
            task_filter: "horses_to_motorcycles"
        without_clipping_dogs_to_cats:
          latex_type: "tab"
          caption: "Comprehensive Results: midsteer\\_sa\\_fix\\_50k\\_last\\_no\\_renorm\\_no\\_clip\\_all\\_strengths - Dogs$\\to$Cats"
          single_experiment_result:
            experiment_path: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_no_clip_all_strengths"
            enable_highlighting: true
            task_filter: "dogs_to_cats"
        without_clipping_horses_to_motorcycles:
          latex_type: "tab"
          caption: "Comprehensive Results: midsteer\\_sa\\_fix\\_50k\\_last\\_no\\_renorm\\_no\\_clip\\_all\\_strengths - Horses$\\to$Motorcycles"
          single_experiment_result:
            experiment_path: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_no_clip_all_strengths"
            enable_highlighting: true
            task_filter: "horses_to_motorcycles"
        method_specific_summary:
          latex_type: "tab"
          caption: "Summary Results: Method-Specific Experiments - Combined Tasks (β ∈ [2.0, 2.5, 3.0])"
          single_experiment_result:
            casteer_leace_experiment: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_clip_all_strengths"
            midsteer_experiment: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_no_clip_all_strengths"
            enable_highlighting: true
            selected_betas: [2.0, 2.5, 3.0]
            task_filter: ["dogs_to_cats", "horses_to_motorcycles"]

  - config:
      name: "Pareto efficient frontier"
      template_file: "subsection_pareto_frontier.tex"
      skip: false
      artifacts:
        # Normal mode experiments (4 total)
        dogs_cats_with_clipping:
          latex_type: "fig"
          caption: "Pareto Efficiency Frontier for Dogs $\\to$ Cats steering, with clipping"
          pareto_frontier_chart:
            width: "0.9"
            enable_highlighting: true
            mixed_mode: false
            experiment_path: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_clip_all_strengths"
        horses_motorcycles_with_clipping:
          latex_type: "fig"
          caption: "Pareto Efficiency Frontier for Horses $\\to$ Motorcycles steering, with clipping"
          pareto_frontier_chart:
            width: "0.9"
            enable_highlighting: true
            mixed_mode: false
            experiment_path: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_clip_all_strengths"
        dogs_cats_without_clipping:
          latex_type: "fig"
          caption: "Pareto Efficiency Frontier for Dogs $\\to$ Cats steering, without clipping"
          pareto_frontier_chart:
            width: "0.9"
            enable_highlighting: true
            mixed_mode: false
            experiment_path: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_no_clip_all_strengths"
        horses_motorcycles_without_clipping:
          latex_type: "fig"
          caption: "Pareto Efficiency Frontier for Horses $\\to$ Motorcycles steering, without clipping"
          pareto_frontier_chart:
            width: "0.9"
            enable_highlighting: true
            mixed_mode: false
            experiment_path: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_no_clip_all_strengths"
        # Mixed mode experiments (2 total)
        dogs_cats_mixed_clipping:
          latex_type: "fig"
          caption: "Pareto Efficiency Frontier for Dogs $\\to$ Cats steering and mixed clipping use"
          pareto_frontier_chart:
            width: "1.3"
            enable_highlighting: true
            mixed_mode: true
            clip_experiment: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_clip_all_strengths"
            no_clip_experiment: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_no_clip_all_strengths"
        horses_motorcycles_mixed_clipping:
          latex_type: "fig"
          caption: "Pareto Efficiency Frontier for Horse $\\to$ Motorcycle steering and mixed clipping use"
          pareto_frontier_chart:
            width: "1.3"
            enable_highlighting: true
            mixed_mode: true
            clip_experiment: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_clip_all_strengths"
            no_clip_experiment: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_no_clip_all_strengths"

  - config:
      name: "Covariance comparison"
      template_file: "subsection_covariance_comparison.tex"
      skip: false
      artifacts:
        comparison_plots:
          latex_type: "fig"
          caption: "Alpaca BLEU scores on a held-out subset for different methods and different steering tasks. Covariances are estimated on a separate training subset using 100, 500, 1000, 5000, 10000, 20000 and 50000 samples."
          covariance_comparison_chart:
            width: "1.1"
            pattern: "midsteer_sa_fix_{num}_last_no_renorm_no_clip"
            methods: ["leace", "mean_matching"]
            beta: 2.0

  - config:
      name: "Implicit concepts"
      template_file: "subsection_implicit_concepts.tex"
      skip: false
      artifacts:
        horses_concept_table:
          latex_type: "tab"
          caption: "Comprehensive Results: Implicit Concept (avg. of 2 concepts) - Horses$\\to$Motorcycles"
          implicit_concept_result:
            source_concepts: ["knight's riding mammal", "large equine"]
            casteer_leace_experiment: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_clip_all_strengths"
            midsteer_experiment: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_no_clip_all_strengths"
            enable_highlighting: true
            selected_betas: [2.0, 3.0, 4.0]
        dogs_concept_table:
          latex_type: "tab"
          caption: "Comprehensive Results: Implicit Concept (avg. of 2 concepts) - Dogs$\\to$Cats"
          implicit_concept_result:
            source_concepts: ["man's best friend", "domesticated canine"]
            casteer_leace_experiment: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_clip_all_strengths"
            midsteer_experiment: "llm_exp/results/llama-2-7b-chat-hf/midsteer_sa_fix_50k_last_no_renorm_no_clip_all_strengths"
            enable_highlighting: true
            selected_betas: [2.0, 3.0, 4.0]